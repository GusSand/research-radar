<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Addition by Subtraction: safety neurons removed during finetuning, behavior redistributed to network">
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="20" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1a1a1a">Addition by Subtraction — Redistributing Safety Alignment</text>
  <!-- Original model -->
  <rect x="10" y="40" width="130" height="80" rx="4" fill="#fde8e8" stroke="#8b1a1a" stroke-width="1.5"/>
  <text x="75" y="68" text-anchor="middle" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#8b1a1a">Original Model</text>
  <text x="75" y="84" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#8b1a1a">Safety concentrated</text>
  <text x="75" y="98" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#8b1a1a">in sparse neurons</text>
  <text x="75" y="112" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#c04040">Fragile to pruning</text>
  <!-- Arrow -->
  <line x1="145" y1="80" x2="195" y2="80" stroke="#555" stroke-width="1.5"/>
  <polygon points="195,75 205,80 195,85" fill="#555"/>
  <!-- Finetuning step -->
  <rect x="210" y="40" width="130" height="80" rx="4" fill="#fff8e1" stroke="#a05c00" stroke-width="1.5"/>
  <text x="275" y="66" text-anchor="middle" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#a05c00">Subtraction Phase</text>
  <text x="275" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#a05c00">Remove safety-critical</text>
  <text x="275" y="96" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#a05c00">neurons iteratively</text>
  <text x="275" y="110" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#a05c00">+ preference optim.</text>
  <!-- Arrow -->
  <line x1="345" y1="80" x2="395" y2="80" stroke="#555" stroke-width="1.5"/>
  <polygon points="395,75 405,80 395,85" fill="#555"/>
  <!-- Robust model -->
  <rect x="410" y="40" width="80" height="80" rx="4" fill="#e8f4e8" stroke="#1a6e3c" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#1a6e3c">Robust</text>
  <text x="450" y="84" text-anchor="middle" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#1a6e3c">Model</text>
  <text x="450" y="102" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#1a6e3c">Distributed</text>
  <text x="450" y="116" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#1a6e3c">safety</text>
  <!-- Results row -->
  <rect x="10" y="140" width="480" height="65" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="250" y="160" text-anchor="middle" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#333">Key Results — 4 models, 3 vendors</text>
  <text x="250" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#444">Up to 90% attack success rate reduction on pruning &amp; ablation attacks</text>
  <text x="250" y="196" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#444">Generalizes to many black-box jailbreaks · Improved truthfulness · Capabilities preserved</text>
</svg>
