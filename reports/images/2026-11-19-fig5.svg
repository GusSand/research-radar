<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="SkillCFI: Control-Flow Integrity for Agent Skills">
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="25" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SkillCFI: Control-Flow Integrity for Agent Skills</text>
  <!-- Phase labels -->
  <text x="130" y="50" font-family="Georgia,serif" font-size="11" fill="#1a4f99" text-anchor="middle">Offline Compilation</text>
  <text x="370" y="50" font-family="Georgia,serif" font-size="11" fill="#b02020" text-anchor="middle">Online Enforcement</text>
  <line x1="250" y1="45" x2="250" y2="195" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Skill source -->
  <rect x="20" y="60" width="85" height="45" rx="5" fill="#e8f0fb" stroke="#1a4f99" stroke-width="1.5"/>
  <text x="62" y="80" font-family="Georgia,serif" font-size="10" fill="#1a4f99" text-anchor="middle">Skill (prompt</text>
  <text x="62" y="95" font-family="Georgia,serif" font-size="10" fill="#1a4f99" text-anchor="middle">+ code)</text>
  <!-- Arrow -->
  <line x1="105" y1="82" x2="130" y2="82" stroke="#555" stroke-width="1.5" marker-end="url(#ar5)"/>
  <defs><marker id="ar5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#555"/></marker></defs>
  <!-- Compiler -->
  <rect x="130" y="60" width="85" height="45" rx="5" fill="#e8f4e8" stroke="#1a6e3c" stroke-width="1.5"/>
  <text x="172" y="80" font-family="Georgia,serif" font-size="10" fill="#1a6e3c" text-anchor="middle">Compiler</text>
  <text x="172" y="95" font-family="Georgia,serif" font-size="10" fill="#1a6e3c" text-anchor="middle">(CFI Contract)</text>
  <!-- Contract output -->
  <rect x="58" y="130" width="155" height="40" rx="5" fill="#fff8e1" stroke="#a05c00" stroke-width="1.5"/>
  <text x="135" y="148" font-family="Georgia,serif" font-size="10" fill="#a05c00" text-anchor="middle">Executable contract:</text>
  <text x="135" y="162" font-family="Georgia,serif" font-size="9.5" fill="#a05c00" text-anchor="middle">obligations + evidence requirements</text>
  <line x1="172" y1="105" x2="135" y2="130" stroke="#555" stroke-width="1.2" marker-end="url(#ar5)"/>
  <!-- Runtime: LLM Agent -->
  <rect x="275" y="60" width="85" height="45" rx="5" fill="#e8f0fb" stroke="#1a4f99" stroke-width="1.5"/>
  <text x="317" y="80" font-family="Georgia,serif" font-size="10" fill="#1a4f99" text-anchor="middle">LLM Agent</text>
  <text x="317" y="95" font-family="Georgia,serif" font-size="10" fill="#1a4f99" text-anchor="middle">(tool requests)</text>
  <!-- Runtime enforcer -->
  <rect x="275" y="130" width="85" height="45" rx="5" fill="#fce8e8" stroke="#b02020" stroke-width="1.5"/>
  <text x="317" y="150" font-family="Georgia,serif" font-size="10" fill="#b02020" text-anchor="middle">Enforcer</text>
  <text x="317" y="165" font-family="Georgia,serif" font-size="9.5" fill="#b02020" text-anchor="middle">(deterministic)</text>
  <line x1="317" y1="105" x2="317" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#ar5)"/>
  <!-- Allow/block outputs -->
  <line x1="360" y1="150" x2="395" y2="135" stroke="#1a6e3c" stroke-width="1.5" marker-end="url(#ar5)"/>
  <text x="410" y="135" font-family="Georgia,serif" font-size="10" fill="#1a6e3c">Allow</text>
  <line x1="360" y1="155" x2="395" y2="168" stroke="#b02020" stroke-width="1.5" marker-end="url(#ar5)"/>
  <text x="410" y="172" font-family="Georgia,serif" font-size="10" fill="#b02020">Block</text>
  <!-- Result -->
  <text x="250" y="200" font-family="Georgia,serif" font-size="9.5" fill="#333" text-anchor="middle">770 sessions: blocked all 240 violations · 1.08× overhead · 65% recovery with guidance</text>
</svg>
