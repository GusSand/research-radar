<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Paired attribution graphs for clean vs jailbroken prompts — suppression, emergence, rerouting">
  <!-- Background -->
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="16" font-family="Georgia,serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Mech Interp of LLM Jailbreaks via Attribution Graphs (2607.07903)</text>

  <!-- Left panel: clean prompt graph -->
  <rect x="20" y="28" width="210" height="165" rx="5" fill="#fafafa" stroke="#0d7377" stroke-width="1.5"/>
  <text x="125" y="46" font-family="Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#0d7377">Clean Prompt</text>

  <!-- Nodes: safety features active -->
  <circle cx="125" cy="75" r="14" fill="#0d7377"/>
  <text x="125" y="79" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#fff">Safety</text>
  <!-- Input node -->
  <circle cx="65" cy="115" r="10" fill="#ccc" stroke="#888" stroke-width="1"/>
  <text x="65" y="119" font-family="Arial,sans-serif" font-size="7" text-anchor="middle" fill="#555">Input</text>
  <!-- Output node -->
  <circle cx="185" cy="115" r="10" fill="#ccc" stroke="#888" stroke-width="1"/>
  <text x="185" y="119" font-family="Arial,sans-serif" font-size="7" text-anchor="middle" fill="#555">Refuse</text>
  <!-- Arrows through safety -->
  <line x1="75" y1="115" x2="111" y2="84" stroke="#0d7377" stroke-width="2" marker-end="url(#d1)"/>
  <line x1="139" y1="84" x2="175" y2="110" stroke="#0d7377" stroke-width="2" marker-end="url(#d2)"/>
  <!-- Safety node label -->
  <text x="125" y="105" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#0d7377">ACTIVE</text>

  <text x="125" y="145" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#333">Safety component active</text>
  <text x="125" y="158" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#333">Normal computation path</text>
  <text x="125" y="183" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#0d7377">Result: refusal</text>

  <!-- Right panel: attacked prompt graph -->
  <rect x="270" y="28" width="210" height="165" rx="5" fill="#fafafa" stroke="#b02020" stroke-width="1.5"/>
  <text x="375" y="46" font-family="Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#b02020">Jailbroken Prompt</text>

  <!-- Safety node: suppressed -->
  <circle cx="375" cy="75" r="14" fill="#eee" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="375" y="79" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#aaa">Safety</text>
  <line x1="362" y1="62" x2="388" y2="88" stroke="#b02020" stroke-width="2"/>
  <line x1="388" y1="62" x2="362" y2="88" stroke="#b02020" stroke-width="2"/>

  <!-- Attack emergent node -->
  <circle cx="375" cy="130" r="12" fill="#b02020"/>
  <text x="375" y="134" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#fff">Attack</text>

  <!-- Rerouted path bypassing safety -->
  <circle cx="315" cy="115" r="10" fill="#ccc" stroke="#888" stroke-width="1"/>
  <text x="315" y="119" font-family="Arial,sans-serif" font-size="7" text-anchor="middle" fill="#555">Input</text>
  <circle cx="435" cy="115" r="10" fill="#ccc" stroke="#888" stroke-width="1"/>
  <text x="435" y="119" font-family="Arial,sans-serif" font-size="7" text-anchor="middle" fill="#555">Comply</text>
  <!-- Rerouted arrow bypassing suppressed safety -->
  <path d="M 325 115 Q 375 165 425 115" fill="none" stroke="#b02020" stroke-width="2" marker-end="url(#d3)"/>
  <text x="375" y="170" font-family="Arial,sans-serif" font-size="7" text-anchor="middle" fill="#b02020">bypass route</text>

  <text x="375" y="183" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#b02020">Result: harmful output</text>

  <text x="250" y="207" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#666">Graph alignment decomposes attack into: suppressed (safety), emergent (attack), rerouted (computation path)</text>
  <text x="250" y="218" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#666">Vulnerability motifs predict jailbreak success before attack execution</text>

  <defs>
    <marker id="d1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#0d7377"/></marker>
    <marker id="d2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#0d7377"/></marker>
    <marker id="d3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#b02020"/></marker>
  </defs>
</svg>
