<svg viewBox="0 0 540 230" xmlns="http://www.w3.org/2000/svg" aria-label="DIJA attack: AR-LLM vs dLLM jailbreak mechanism">
  <!-- Background -->
  <rect width="540" height="230" fill="#ffffff"/>

  <!-- Title -->
  <text x="270" y="22" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">DIJA — Bidirectional Mask Jailbreak vs. AR-LLM Jailbreak</text>

  <!-- LEFT panel: AR-LLM -->
  <rect x="12" y="32" width="248" height="186" rx="4" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="136" y="50" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#333333" text-anchor="middle">Autoregressive LLM</text>

  <!-- Token boxes AR -->
  <rect x="22" y="58" width="44" height="22" rx="2" fill="#e0e0e0" stroke="#aaaaaa" stroke-width="1"/>
  <text x="44" y="73" font-family="Courier New, monospace" font-size="9" fill="#333333" text-anchor="middle">Tell me</text>
  <rect x="72" y="58" width="44" height="22" rx="2" fill="#e0e0e0" stroke="#aaaaaa" stroke-width="1"/>
  <text x="94" y="73" font-family="Courier New, monospace" font-size="9" fill="#333333" text-anchor="middle">how to</text>
  <rect x="122" y="58" width="44" height="22" rx="2" fill="#ffb3b3" stroke="#cc4444" stroke-width="1"/>
  <text x="144" y="73" font-family="Courier New, monospace" font-size="9" fill="#990000" text-anchor="middle">[HARM]</text>
  <rect x="172" y="58" width="44" height="22" rx="2" fill="#e0e0e0" stroke="#aaaaaa" stroke-width="1"/>
  <text x="194" y="73" font-family="Courier New, monospace" font-size="9" fill="#333333" text-anchor="middle">a bomb</text>

  <!-- Arrows between AR tokens -->
  <line x1="66" y1="69" x2="72" y2="69" stroke="#888888" stroke-width="1" marker-end="url(#a25)"/>
  <line x1="116" y1="69" x2="122" y2="69" stroke="#888888" stroke-width="1" marker-end="url(#a25)"/>
  <line x1="166" y1="69" x2="172" y2="69" stroke="#888888" stroke-width="1" marker-end="url(#a25)"/>

  <defs>
    <marker id="a25" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888888"/>
    </marker>
    <marker id="b25" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cc0000"/>
    </marker>
    <marker id="c25" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a6e3c"/>
    </marker>
  </defs>

  <!-- RLHF detector AR -->
  <rect x="22" y="96" width="216" height="28" rx="3" fill="#ffe0e0" stroke="#cc4444" stroke-width="1.5"/>
  <text x="130" y="107" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#cc0000" text-anchor="middle">RLHF Detector sees [HARM] token</text>
  <text x="130" y="119" font-family="Georgia, serif" font-size="9" fill="#cc0000" text-anchor="middle">→ REFUSAL fires</text>

  <!-- Result AR -->
  <rect x="60" y="138" width="136" height="24" rx="3" fill="#ffeeee" stroke="#cc4444" stroke-width="1"/>
  <text x="128" y="154" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#cc0000" text-anchor="middle">✗  Attack blocked</text>

  <text x="136" y="188" font-family="Georgia, serif" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">Jailbreak must hide payload in explicit</text>
  <text x="136" y="200" font-family="Georgia, serif" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">token stream — RLHF always sees it</text>

  <!-- RIGHT panel: dLLM / DIJA -->
  <rect x="280" y="32" width="248" height="186" rx="4" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="404" y="50" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#333333" text-anchor="middle">Masked Diffusion LLM (DIJA)</text>

  <!-- Token boxes dLLM -->
  <rect x="290" y="58" width="44" height="22" rx="2" fill="#e0e0e0" stroke="#aaaaaa" stroke-width="1"/>
  <text x="312" y="73" font-family="Courier New, monospace" font-size="9" fill="#333333" text-anchor="middle">Tell me</text>
  <rect x="340" y="58" width="44" height="22" rx="2" fill="#d0e8ff" stroke="#4488cc" stroke-width="1"/>
  <text x="362" y="73" font-family="Courier New, monospace" font-size="9" fill="#224488" text-anchor="middle">[MASK]</text>
  <rect x="390" y="58" width="44" height="22" rx="2" fill="#d0e8ff" stroke="#4488cc" stroke-width="1"/>
  <text x="412" y="73" font-family="Courier New, monospace" font-size="9" fill="#224488" text-anchor="middle">[MASK]</text>
  <rect x="440" y="58" width="44" height="22" rx="2" fill="#e0e0e0" stroke="#aaaaaa" stroke-width="1"/>
  <text x="462" y="73" font-family="Courier New, monospace" font-size="9" fill="#333333" text-anchor="middle">a bomb</text>

  <!-- Bidirectional arrows -->
  <line x1="334" y1="69" x2="340" y2="69" stroke="#888888" stroke-width="1" marker-end="url(#a25)"/>
  <line x1="384" y1="69" x2="390" y2="69" stroke="#888888" stroke-width="1" marker-end="url(#a25)"/>
  <line x1="434" y1="69" x2="440" y2="69" stroke="#888888" stroke-width="1" marker-end="url(#a25)"/>
  <!-- Left-to-right context line -->
  <path d="M312,56 Q362,40 412,56" stroke="#4488cc" stroke-width="1.2" fill="none"/>
  <path d="M412,56 Q362,40 312,56" stroke="#cc7722" stroke-width="0.8" fill="none" stroke-dasharray="3,2"/>

  <!-- RLHF detector dLLM -->
  <rect x="290" y="96" width="216" height="28" rx="3" fill="#e8f4e8" stroke="#448844" stroke-width="1.5"/>
  <text x="398" y="107" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#1a6e3c" text-anchor="middle">RLHF sees only [MASK] — no payload</text>
  <text x="398" y="119" font-family="Georgia, serif" font-size="9" fill="#1a6e3c" text-anchor="middle">→ passes without refusal</text>

  <!-- Denoising fill -->
  <rect x="310" y="136" width="188" height="22" rx="3" fill="#fff0d0" stroke="#cc8800" stroke-width="1"/>
  <text x="404" y="151" font-family="Courier New, monospace" font-size="9" fill="#884400" text-anchor="middle">Bidirectional fill → "how to make"</text>

  <!-- Result dLLM -->
  <rect x="340" y="168" width="128" height="22" rx="3" fill="#e8f4e8" stroke="#448844" stroke-width="1"/>
  <text x="404" y="183" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#1a6e3c" text-anchor="middle">✓  Attack succeeds</text>

  <!-- ASR stat -->
  <text x="404" y="208" font-family="Georgia, serif" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">+78.5 pp ASR over ReNeLLM on Dream-Instruct</text>
</svg>
