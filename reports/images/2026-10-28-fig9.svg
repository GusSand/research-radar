<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Causal Localization of Evidence Effects: BUC method for finding evidence-weighing attention heads">
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="18" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#333" font-weight="bold">CEA + BUC: Symbolic Probing → Causal Head Selection → NL Transfer</text>
  <!-- Stage 1: CEA -->
  <rect x="10" y="28" width="140" height="80" rx="4" fill="#e8eef8" stroke="#4a6ea8" stroke-width="1.5"/>
  <text x="80" y="44" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a" font-weight="bold">1. CEA Symbolic Probe</text>
  <text x="80" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">"AAA BBB AAA" →</text>
  <text x="80" y="74" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#4a6ea8">logit(A) – logit(B)</text>
  <text x="80" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#666">counts + order varied</text>
  <text x="80" y="102" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#666">no prescribed answer</text>
  <!-- Arrow -->
  <line x1="150" y1="68" x2="178" y2="68" stroke="#333" stroke-width="1.5" marker-end="url(#c1)"/>
  <!-- Stage 2: BUC -->
  <rect x="178" y="28" width="150" height="80" rx="4" fill="#fdf4e8" stroke="#a87a30" stroke-width="1.5"/>
  <text x="253" y="44" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a" font-weight="bold">2. BUC Head Selection</text>
  <text x="253" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">Score: ablation removes</text>
  <text x="253" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">+ patch restores effect</text>
  <text x="253" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#666">1–12 heads per regime</text>
  <text x="253" y="101" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#a87a30">65.5–91.6% removed</text>
  <!-- Arrow -->
  <line x1="328" y1="68" x2="356" y2="68" stroke="#333" stroke-width="1.5" marker-end="url(#c2)"/>
  <!-- Stage 3: NL transfer -->
  <rect x="356" y="28" width="134" height="80" rx="4" fill="#e8f4e8" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="423" y="44" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a" font-weight="bold">3. NL Transfer</text>
  <text x="423" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">"Which state has</text>
  <text x="423" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">more reports?"</text>
  <text x="423" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#2a7a2a">Ablate 8 heads →</text>
  <text x="423" y="101" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#2a7a2a">acc ↓ 8.2pp (vs 0.8pp rand)</text>
  <!-- Bottom comparison bar -->
  <rect x="10" y="125" width="480" height="30" rx="3" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  <text x="90" y="141" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#333">Symbolic probes (CEA)</text>
  <line x1="180" y1="125" x2="180" y2="155" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="141" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#4a6ea8">→ BUC selects causal heads →</text>
  <line x1="320" y1="125" x2="320" y2="155" stroke="#ddd" stroke-width="1"/>
  <text x="405" y="141" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#2a7a2a">NL task effect confirmed</text>
  <!-- Summary -->
  <text x="250" y="173" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#333">Pythia-410M: symbolic → natural-language causal transfer</text>
  <text x="250" y="188" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#666">8 heads selected on yes/no probes → 8.2pp accuracy drop on held-out NL evidence task</text>
  <!-- Markers -->
  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="c2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
  </defs>
</svg>
