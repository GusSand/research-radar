<svg viewBox="0 0 500 240" xmlns="http://www.w3.org/2000/svg" aria-label="FBS Debate Protocol: Alice decomposes claim, Bob checks sensitivity or picks sub-claim">
  <!-- White background -->
  <rect width="500" height="240" fill="#fff"/>
  <!-- Title -->
  <text x="250" y="22" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FBS Debate Protocol (one round at level k)</text>
  <!-- Alice box -->
  <rect x="30" y="44" width="120" height="44" rx="6" fill="#e8f0fb" stroke="#1a4f99" stroke-width="1.5"/>
  <text x="90" y="64" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a4f99">Alice</text>
  <text x="90" y="80" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#3a3a3a">decomposes claim</text>
  <!-- Arrow to Claim -->
  <line x1="150" y1="66" x2="190" y2="66" stroke="#444" stroke-width="1.5" marker-end="url(#ar1)"/>
  <defs>
    <marker id="ar1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444"/>
    </marker>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444"/>
    </marker>
  </defs>
  <!-- Claim sub-claims box -->
  <rect x="190" y="44" width="120" height="44" rx="6" fill="#f5f0e8" stroke="#a05c00" stroke-width="1.5"/>
  <text x="250" y="64" font-family="Georgia, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#a05c00">Sub-claims</text>
  <text x="250" y="80" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#3a3a3a">c₁, c₂, … cₙ</text>
  <!-- Arrow to Bob -->
  <line x1="310" y1="66" x2="350" y2="66" stroke="#444" stroke-width="1.5" marker-end="url(#ar2)"/>
  <!-- Bob box -->
  <rect x="350" y="44" width="120" height="44" rx="6" fill="#fbe8e8" stroke="#b02020" stroke-width="1.5"/>
  <text x="410" y="64" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b02020">Bob</text>
  <text x="410" y="80" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#3a3a3a">sensitivity check / pick cᵢ</text>
  <!-- Sensitivity check branch -->
  <line x1="410" y1="88" x2="410" y2="120" stroke="#b02020" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Branch A: sensitivity flag -->
  <rect x="330" y="122" width="160" height="36" rx="6" fill="#fce8fb" stroke="#5c1aaa" stroke-width="1.2"/>
  <text x="410" y="136" font-family="Georgia, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#5c1aaa">FBS(decomp) high?</text>
  <text x="410" y="150" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#3a3a3a">→ Alice loses this branch</text>
  <!-- Branch B: recurse -->
  <line x1="250" y1="88" x2="250" y2="175" stroke="#1a4f99" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="170" y="177" width="160" height="36" rx="6" fill="#e8f0fb" stroke="#1a4f99" stroke-width="1.2"/>
  <text x="250" y="191" font-family="Georgia, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a4f99">Recurse on cᵢ</text>
  <text x="250" y="207" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#3a3a3a">at level k-1</text>
  <!-- Key property text -->
  <text x="250" y="232" font-family="Georgia, serif" font-size="9.5" text-anchor="middle" fill="#888">Honest Alice always wins if claim is true; honest Bob wins w.h.p. if false</text>
</svg>
