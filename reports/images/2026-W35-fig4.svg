<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="5-layer trust-boundary taxonomy for embodied agent security — 58 attacks, 61 defenses">
  <!-- Background -->
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="16" font-family="Georgia,serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Embodied Agent Security: 5-Layer Taxonomy (2608.16843)</text>

  <!-- 5-layer stack, left column -->
  <!-- Layer 5: Model Supply Chain (top) -->
  <rect x="40" y="25" width="240" height="28" rx="4" fill="#fde8e8" stroke="#b02020" stroke-width="1.5"/>
  <text x="160" y="43" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#b02020">L1 · Model Supply Chain</text>

  <!-- Layer 4: User Instructions -->
  <rect x="40" y="62" width="240" height="28" rx="4" fill="#fde8e8" stroke="#b02020" stroke-width="1.2"/>
  <text x="160" y="80" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#b02020">L2 · User Instructions</text>

  <!-- Layer 3: Context / Memory -->
  <rect x="40" y="99" width="240" height="28" rx="4" fill="#fff3cd" stroke="#a05c00" stroke-width="1.2"/>
  <text x="160" y="117" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#a05c00">L3 · Context &amp; Memory</text>

  <!-- Layer 2: Embodied Perception -->
  <rect x="40" y="136" width="240" height="28" rx="4" fill="#fff3cd" stroke="#a05c00" stroke-width="1.2"/>
  <text x="160" y="154" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#a05c00">L4 · Embodied Perception</text>

  <!-- Layer 1: Physical Actuators -->
  <rect x="40" y="173" width="240" height="28" rx="4" fill="#fde8e8" stroke="#b02020" stroke-width="1.5"/>
  <text x="160" y="191" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#b02020">L5 · Physical Actuators</text>

  <!-- Bracket labels on right side -->
  <line x1="290" y1="25" x2="300" y2="25" stroke="#aaa" stroke-width="1"/>
  <line x1="290" y1="201" x2="300" y2="201" stroke="#aaa" stroke-width="1"/>
  <line x1="300" y1="25" x2="300" y2="201" stroke="#aaa" stroke-width="1"/>
  <line x1="300" y1="113" x2="320" y2="113" stroke="#b02020" stroke-width="1.5" marker-end="url(#c1)"/>

  <!-- Right panel: statistics -->
  <rect x="330" y="28" width="145" height="90" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="402" y="46" font-family="Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Corpus</text>
  <text x="340" y="64" font-family="Arial,sans-serif" font-size="10" fill="#b02020">58</text>
  <text x="358" y="64" font-family="Arial,sans-serif" font-size="10" fill="#333"> attack records</text>
  <text x="340" y="80" font-family="Arial,sans-serif" font-size="10" fill="#0d7377">61</text>
  <text x="358" y="80" font-family="Arial,sans-serif" font-size="10" fill="#333"> defense records</text>
  <text x="340" y="96" font-family="Arial,sans-serif" font-size="10" fill="#888">through Aug 15, 2026</text>
  <text x="340" y="112" font-family="Arial,sans-serif" font-size="9" fill="#888">12 attack surfaces</text>

  <!-- Cross-layer cascade indicator -->
  <rect x="330" y="132" width="145" height="65" rx="5" fill="#fde8e8" stroke="#b02020" stroke-width="1"/>
  <text x="402" y="148" font-family="Arial,sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#b02020">Most dangerous:</text>
  <text x="402" y="162" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#b02020">cross-layer cascades</text>
  <text x="402" y="176" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#888">digital jailbreak →</text>
  <text x="402" y="188" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#888">physical harm</text>

  <text x="250" y="212" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#666">Trust-boundary-centric: "first-compromised-trust-boundary" separates attack surface from mechanism</text>

  <defs>
    <marker id="c1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#b02020"/></marker>
  </defs>
</svg>
