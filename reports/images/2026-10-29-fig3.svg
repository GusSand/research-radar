<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Attack reuse and defense revision after prompt injection: empirical findings from Tensor Trust">
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="17" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#333" font-weight="bold">Prompt-Injection Attack Reuse Cycle (Tensor Trust, 563K records)</text>
  <!-- Attacker box -->
  <rect x="10" y="35" width="80" height="40" rx="4" fill="#fce8e8" stroke="#a83030" stroke-width="1.5"/>
  <text x="50" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#a83030" font-weight="bold">Attacker</text>
  <text x="50" y="69" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#555">submits attack</text>
  <!-- Arrow to defense -->
  <line x1="90" y1="55" x2="138" y2="55" stroke="#a83030" stroke-width="1.5" marker-end="url(#a1)"/>
  <!-- Defense box -->
  <rect x="138" y="35" width="90" height="40" rx="4" fill="#e8eef8" stroke="#4a6ea8" stroke-width="1.5"/>
  <text x="183" y="52" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#4a6ea8" font-weight="bold">Target</text>
  <text x="183" y="66" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#555">Defense prompt</text>
  <!-- Two arrows out: success, failure -->
  <!-- Success arrow down -->
  <line x1="183" y1="75" x2="183" y2="105" stroke="#2a7a2a" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="195" y="92" font-family="Georgia,serif" font-size="8" fill="#2a7a2a">BREACH</text>
  <!-- Failure arrow right -->
  <line x1="228" y1="55" x2="275" y2="55" stroke="#888" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="252" y="50" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#888">FAIL</text>
  <!-- Breach outcome box -->
  <rect x="110" y="105" width="145" height="55" rx="4" fill="#e8fce8" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="183" y="121" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#2a7a2a" font-weight="bold">Target receives attack text</text>
  <text x="183" y="136" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#333">10.0% reuse within 1 week</text>
  <text x="183" y="150" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#666">vs. 0.03% matched baseline</text>
  <!-- Defense revision box -->
  <rect x="110" y="170" width="145" height="35" rx="4" fill="#fdf4e8" stroke="#a87a30" stroke-width="1.5"/>
  <text x="183" y="185" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#a87a30" font-weight="bold">Defense revised after breach</text>
  <text x="183" y="198" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#555">Same-family ASR ↓ 24.5 pp</text>
  <!-- Arrow from breach to defense revision -->
  <line x1="183" y1="160" x2="183" y2="170" stroke="#a87a30" stroke-width="1.5" marker-end="url(#a4)"/>
  <!-- Failure outcome box -->
  <rect x="275" y="35" width="110" height="40" rx="4" fill="#f8f8f8" stroke="#ccc" stroke-width="1.5"/>
  <text x="330" y="52" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#666">Matched circulating</text>
  <text x="330" y="65" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#666">attacks: 0.03% reuse</text>
  <!-- Reuse arrow back to attacker -->
  <path d="M183,155 Q50,155 50,95" stroke="#a83030" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#a5)"/>
  <text x="60" y="130" font-family="Georgia,serif" font-size="8" fill="#a83030">Victim</text>
  <text x="60" y="141" font-family="Georgia,serif" font-size="8" fill="#a83030">becomes</text>
  <text x="60" y="152" font-family="Georgia,serif" font-size="8" fill="#a83030">attacker</text>
  <!-- Key stat -->
  <text x="430" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#a83030" font-weight="bold">23.2%</text>
  <text x="430" y="144" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#555">of successful</text>
  <text x="430" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#555">hijacks used</text>
  <text x="430" y="166" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#555">received text</text>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a83030"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2a7a2a"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#888"/></marker>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a87a30"/></marker>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a83030"/></marker>
  </defs>
</svg>
