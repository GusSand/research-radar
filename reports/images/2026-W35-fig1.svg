<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="J-space global workspace diagram — compact verbalizable region vs large hidden computation ocean">
  <!-- Background -->
  <rect width="500" height="220" fill="#fff"/>

  <!-- Title -->
  <text x="250" y="18" font-family="Georgia,serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Verbalizable Representations Form a Global Workspace (J-Lens)</text>

  <!-- Large hidden computation region -->
  <rect x="30" y="35" width="440" height="145" rx="8" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
  <text x="250" y="52" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#888">Residual stream — total computation (100% of activity)</text>

  <!-- J-space compact region -->
  <rect x="160" y="65" width="180" height="80" rx="6" fill="#dbeafe" stroke="#1a4f99" stroke-width="2"/>
  <text x="250" y="86" font-family="Georgia,serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a4f99">J-space</text>
  <text x="250" y="101" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#1a4f99">Verbalizable concepts</text>
  <text x="250" y="114" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#1a4f99">(~dozens, &lt;10% activity)</text>
  <text x="250" y="128" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#1a4f99">Global workspace structure</text>

  <!-- Automatic computation label outside -->
  <text x="75" y="150" font-family="Arial,sans-serif" font-size="10" fill="#999">Automatic computation</text>
  <text x="75" y="163" font-family="Arial,sans-serif" font-size="10" fill="#999">(not directly reportable)</text>

  <!-- Arrow from J-space to output -->
  <line x1="340" y1="105" x2="420" y2="105" stroke="#1a4f99" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="380" y="95" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#1a4f99">to output</text>

  <!-- CoT discrepancy indicator -->
  <line x1="250" y1="145" x2="250" y2="175" stroke="#b02020" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="250" y="190" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#b02020">J-space content ≠ chain-of-thought report (measurable gap)</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#1a4f99"/>
    </marker>
  </defs>

  <!-- Caption -->
  <text x="250" y="210" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#666">J-Lens (Jacobian transport) maps mid-layer activations → output space, revealing compact verbalizable sub-region</text>
</svg>
