<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Orthogonal Boundary Unlearning: activation space with benign subspace and hazardous region">
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="22" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Orthogonal Boundary Unlearning (OBU)</text>
  <!-- Coordinate axes -->
  <line x1="80" y1="180" x2="430" y2="180" stroke="#888" stroke-width="1.2"/>
  <line x1="80" y1="180" x2="80" y2="35" stroke="#888" stroke-width="1.2"/>
  <text x="435" y="184" font-family="Georgia, serif" font-size="11" fill="#555">dim₁</text>
  <text x="70" y="32" font-family="Georgia, serif" font-size="11" fill="#555">dim₂</text>
  <!-- Benign subspace ellipse (blue-green) -->
  <ellipse cx="175" cy="115" rx="75" ry="45" fill="#dff0ea" stroke="#1a6e3c" stroke-width="1.8" stroke-dasharray="0"/>
  <text x="175" y="112" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#1a6e3c" font-weight="bold">Benign</text>
  <text x="175" y="128" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#1a6e3c">subspace V</text>
  <!-- Hazardous region (red) -->
  <ellipse cx="340" cy="105" rx="72" ry="55" fill="#fce8e8" stroke="#b02020" stroke-width="1.8"/>
  <text x="340" y="100" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#b02020" font-weight="bold">Hazardous</text>
  <text x="340" y="116" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#b02020">region</text>
  <!-- Safety boundary (dashed vertical line) -->
  <line x1="255" y1="40" x2="255" y2="180" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="255" y="200" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#555">safety boundary</text>
  <!-- Orthogonal null space arrow (black, perpendicular to subspace) -->
  <line x1="175" y1="115" x2="247" y2="115" stroke="#1a4f99" stroke-width="2"/>
  <polygon points="247,110 260,115 247,120" fill="#1a4f99"/>
  <text x="210" y="108" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#1a4f99">null(V)⊥ update</text>
  <!-- Label -->
  <text x="250" y="215" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#555">SVD-based: parameter updates confined to null space orthogonal to V</text>
</svg>
