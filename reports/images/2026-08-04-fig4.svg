<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="SAEGUARDBENCH: SAE features detect harmful prompts reliably but lack specificity about harm type">
  <!-- background -->
  <rect width="500" height="220" fill="#fff"/>
  <!-- title -->
  <text x="250" y="20" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SAEGUARDBENCH — Sensitivity vs. Specificity of SAE-Based Jailbreak Detection</text>
  <!-- Axes -->
  <line x1="70" y1="40" x2="70" y2="170" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="170" x2="470" y2="170" stroke="#333" stroke-width="1.5"/>
  <!-- Y axis label -->
  <text x="20" y="105" font-family="Georgia, serif" font-size="10" fill="#444" text-anchor="middle" transform="rotate(-90 20 105)">Detection Score</text>
  <!-- X axis labels -->
  <text x="160" y="190" font-family="Georgia, serif" font-size="9" fill="#444" text-anchor="middle">Feature Activation</text>
  <text x="255" y="190" font-family="Georgia, serif" font-size="9" fill="#444" text-anchor="middle">Probing</text>
  <text x="345" y="190" font-family="Georgia, serif" font-size="9" fill="#444" text-anchor="middle">Steering-based</text>
  <text x="435" y="190" font-family="Georgia, serif" font-size="9" fill="#444" text-anchor="middle">Classif.-aware SAE</text>
  <!-- Y axis ticks -->
  <line x1="67" y1="60" x2="73" y2="60" stroke="#333" stroke-width="1"/>
  <text x="62" y="63" font-family="Georgia, serif" font-size="9" fill="#444" text-anchor="end">1.0</text>
  <line x1="67" y1="105" x2="73" y2="105" stroke="#333" stroke-width="1"/>
  <text x="62" y="108" font-family="Georgia, serif" font-size="9" fill="#444" text-anchor="end">0.5</text>
  <line x1="67" y1="170" x2="73" y2="170" stroke="#333" stroke-width="1"/>
  <text x="62" y="173" font-family="Georgia, serif" font-size="9" fill="#444" text-anchor="end">0.0</text>
  <!-- Sensitivity bars (blue) — high across all paradigms -->
  <rect x="90" y="63" width="35" height="107" fill="#1a4f99" opacity="0.8"/>
  <rect x="225" y="70" width="35" height="100" fill="#1a4f99" opacity="0.8"/>
  <rect x="315" y="68" width="35" height="102" fill="#1a4f99" opacity="0.8"/>
  <rect x="405" y="65" width="35" height="105" fill="#1a4f99" opacity="0.8"/>
  <!-- Specificity bars (red) — low for SAE, high for classif-aware -->
  <rect x="130" y="143" width="35" height="27" fill="#b02020" opacity="0.8"/>
  <rect x="265" y="130" width="35" height="40" fill="#b02020" opacity="0.8"/>
  <rect x="355" y="138" width="35" height="32" fill="#b02020" opacity="0.8"/>
  <rect x="445" y="75" width="35" height="95" fill="#b02020" opacity="0.8"/>
  <!-- Legend -->
  <rect x="85" y="200" width="12" height="10" fill="#1a4f99" opacity="0.8"/>
  <text x="101" y="209" font-family="Georgia, serif" font-size="9" fill="#333">Sensitivity (harmful vs safe)</text>
  <rect x="260" y="200" width="12" height="10" fill="#b02020" opacity="0.8"/>
  <text x="276" y="209" font-family="Georgia, serif" font-size="9" fill="#333">Specificity (harm type)</text>
  <!-- Annotation -->
  <text x="440" y="58" font-family="Georgia, serif" font-size="8" fill="#1a6e3c" text-anchor="middle">↑ gap closes</text>
  <text x="440" y="66" font-family="Georgia, serif" font-size="8" fill="#1a6e3c" text-anchor="middle">w/ classif. obj.</text>
</svg>
