<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Stateful deception architecture: attacker isolated per-session, LLM renderer sees only explicit state">
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#222" font-weight="bold">Stateful Deception Cost-Exchange Architecture</text>
  <!-- Attacker box -->
  <rect x="20" y="45" width="90" height="50" rx="6" fill="#fff3f3" stroke="#c94a4a" stroke-width="1.5"/>
  <text x="65" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c94a4a" font-weight="bold">Attacker</text>
  <text x="65" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c94a4a">(isolated session)</text>
  <!-- Arrow A→continuity est -->
  <line x1="110" y1="70" x2="145" y2="70" stroke="#888" stroke-width="1.5" marker-end="url(#arr2)"/>
  <!-- Continuity estimator box -->
  <rect x="145" y="45" width="110" height="50" rx="6" fill="#fff8e1" stroke="#a05c00" stroke-width="1.5"/>
  <text x="200" y="65" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#a05c00" font-weight="bold">Continuity</text>
  <text x="200" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#a05c00">Estimator</text>
  <text x="200" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#888">(maps attacker → state)</text>
  <!-- Arrow continuity→state -->
  <line x1="255" y1="70" x2="285" y2="70" stroke="#888" stroke-width="1.5" marker-end="url(#arr3)"/>
  <!-- Persistent state box -->
  <rect x="285" y="45" width="90" height="50" rx="6" fill="#e8f4e8" stroke="#2eaa5c" stroke-width="1.5"/>
  <text x="330" y="65" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#2eaa5c" font-weight="bold">Persistent</text>
  <text x="330" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#2eaa5c">State DB</text>
  <text x="330" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#888">(per adversary)</text>
  <!-- Arrow state→renderer -->
  <line x1="375" y1="70" x2="405" y2="70" stroke="#888" stroke-width="1.5" marker-end="url(#arr4)"/>
  <!-- LLM Renderer box -->
  <rect x="405" y="45" width="80" height="50" rx="6" fill="#e8e8f8" stroke="#4a4ac9" stroke-width="1.5"/>
  <text x="445" y="65" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a4ac9" font-weight="bold">LLM</text>
  <text x="445" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a4ac9">Renderer</text>
  <text x="445" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#888">(explicit state only)</text>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#888"/></marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#888"/></marker>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#888"/></marker>
  </defs>
  <!-- Cowrie layer underneath -->
  <rect x="20" y="115" width="460" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
  <text x="250" y="131" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#555" font-weight="bold">Cowrie SSH Honeypot (deterministic layer)</text>
  <text x="250" y="147" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#888">Routes commands → LLM only when needed · handles common commands locally</text>
  <!-- Results line -->
  <text x="250" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#222">Key result: 63% reduction in per-session defender cost (5 open-weight models)</text>
  <text x="250" y="193" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#555">Deception Exchange Rate (DER): mission-weighted attacker effort ÷ defender resources</text>
</svg>
