  <text x="433" y="46" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#b02020">Gap=0.50</text>
  <text x="250" y="208" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#444">Model-Value Pairing (32 dimensions × 10 models; representative subset shown)</text>
