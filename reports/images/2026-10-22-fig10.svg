<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Prompt injection through forensic evidence: perception gap allows injection embedded in attacker-controlled evidence to reach LLM undetected by human examiner">
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="18" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Prompt Injection via Forensic Evidence</text>
  <!-- Attacker -->
  <rect x="15" y="40" width="90" height="50" rx="4" fill="#fce8e8" stroke="#b02020" stroke-width="1.5"/>
  <text x="60" y="62" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#b02020" font-weight="bold">Attacker</text>
  <text x="60" y="78" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#888">seized device</text>
  <!-- Evidence -->
  <rect x="140" y="35" width="100" height="70" rx="4" fill="#fff0d0" stroke="#a05c00" stroke-width="1.5"/>
  <text x="190" y="55" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#a05c00" font-weight="bold">Evidence</text>
  <text x="190" y="70" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#555">Files, logs,</text>
  <text x="190" y="82" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#555">artifacts…</text>
  <text x="190" y="98" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#b02020">+ hidden injection</text>
  <!-- Arrow: attacker plants injection -->
  <line x1="105" y1="65" x2="138" y2="65" stroke="#b02020" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="138,65 131,61 131,69" fill="#b02020"/>
  <text x="121" y="58" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#b02020">plants</text>
  <!-- Two paths from evidence -->
  <!-- Path 1: Human examiner (can't see injection) -->
  <line x1="240" y1="55" x2="310" y2="45" stroke="#888" stroke-width="1.5"/>
  <polygon points="310,45 303,44 304,52" fill="#888"/>
  <rect x="312" y="30" width="90" height="40" rx="3" fill="#f0f0f0" stroke="#888" stroke-width="1"/>
  <text x="357" y="47" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#555">Human</text>
  <text x="357" y="59" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#555">Examiner</text>
  <text x="357" y="80" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#1a6e3c">Can't see injection</text>
  <!-- Path 2: LLM reasoning (reads injection) -->
  <line x1="240" y1="75" x2="310" y2="105" stroke="#1a4f99" stroke-width="1.5"/>
  <polygon points="310,105 303,101 305,109" fill="#1a4f99"/>
  <rect x="312" y="90" width="90" height="40" rx="3" fill="#dce8fa" stroke="#1a4f99" stroke-width="1"/>
  <text x="357" y="107" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#1a4f99">LLM</text>
  <text x="357" y="119" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#1a4f99">Reasoning</text>
  <text x="357" y="138" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#b02020">Reads + obeys injection</text>
  <!-- Perception gap label -->
  <text x="435" y="70" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#b02020">PERCEPTION</text>
  <text x="435" y="82" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#b02020">GAP</text>
  <line x1="408" y1="50" x2="408" y2="120" stroke="#b02020" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Outcomes -->
  <text x="250" y="158" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Demonstrated attacks: change conclusion · write to workstation · outbound traffic</text>
  <text x="250" y="175" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#555">Payload carried invisibly through legitimate forensic evidence the examiner must read.</text>
  <text x="250" y="208" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#888">Breitinger et al., 2026 — taxonomy of anti-forensic attacks on LLM-assisted investigations.</text>
</svg>
