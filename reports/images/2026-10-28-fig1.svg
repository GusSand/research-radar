<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="SimpleLoRIF pipeline for tracing safety degradation to training data">
  <rect width="500" height="220" fill="#fff"/>
  <!-- Title -->
  <text x="250" y="20" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#333" font-weight="bold">SimpleLoRIF: Gradient Embedding Pipeline</text>
  <!-- Step boxes -->
  <!-- Box 1: Training data -->
  <rect x="10" y="40" width="90" height="50" rx="4" fill="#e8f4e8" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="55" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">Training</text>
  <text x="55" y="74" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">data (~1M)</text>
  <!-- Arrow -->
  <line x1="100" y1="65" x2="120" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#a1)"/>
  <!-- Box 2: Restricted backprop -->
  <rect x="120" y="40" width="100" height="50" rx="4" fill="#e8eef8" stroke="#4a6ea8" stroke-width="1.5"/>
  <text x="170" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">Backprop</text>
  <text x="170" y="71" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">last 4 blocks</text>
  <text x="170" y="84" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#666">(low-rank proj.)</text>
  <!-- Arrow -->
  <line x1="220" y1="65" x2="240" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>
  <!-- Box 3: Gradient space -->
  <rect x="240" y="40" width="100" height="50" rx="4" fill="#fdf4e8" stroke="#a87a30" stroke-width="1.5"/>
  <text x="290" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">Gradient</text>
  <text x="290" y="71" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">embeddings</text>
  <text x="290" y="84" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#666">AUC ≤ 0.865</text>
  <!-- Arrow -->
  <line x1="340" y1="65" x2="360" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#a3)"/>
  <!-- Box 4: Filter -->
  <rect x="360" y="40" width="90" height="50" rx="4" fill="#fce8e8" stroke="#a83030" stroke-width="1.5"/>
  <text x="405" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">Remove top</text>
  <text x="405" y="71" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">20% unsafe</text>
  <text x="405" y="84" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#666">examples</text>
  <!-- Arrow down to result -->
  <line x1="405" y1="90" x2="405" y2="130" stroke="#a83030" stroke-width="1.5" marker-end="url(#a4)"/>
  <!-- Result box -->
  <rect x="310" y="130" width="180" height="50" rx="4" fill="#e8fce8" stroke="#2a7a2a" stroke-width="2"/>
  <text x="400" y="152" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#1a1a1a" font-weight="bold">SafeTulu</text>
  <text x="400" y="168" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">GCG ASR ↓ up to 22%</text>
  <!-- Reference model box -->
  <rect x="130" y="130" width="140" height="50" rx="4" fill="#f0e8f8" stroke="#6a2aa8" stroke-width="1.5"/>
  <text x="200" y="151" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">Unsafe reference</text>
  <text x="200" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">model gradient</text>
  <!-- dotted line from reference to gradient box -->
  <line x1="270" y1="155" x2="290" y2="90" stroke="#6a2aa8" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Markers -->
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto"><path d="M0,0 L6,0 L3,8 z" fill="#a83030"/></marker>
  </defs>
  <!-- Caption -->
  <text x="250" y="205" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#666">Restricted-layer gradient projection scales to ~1M examples; removes safety-degrading benign data</text>
</svg>
