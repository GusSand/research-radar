<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Human Interventions as Labels: pipeline from agent failure to probe-gated steering">
  <!-- White background -->
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="20" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Human Interventions as Labels</text>
  <!-- Step 1: Agent failure -->
  <rect x="20" y="38" width="90" height="46" rx="5" fill="#fbe8e8" stroke="#b02020" stroke-width="1.5"/>
  <text x="65" y="56" font-family="Georgia, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#b02020">Agent</text>
  <text x="65" y="68" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#3a3a3a">Failure</text>
  <text x="65" y="79" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#888">(over-asks)</text>
  <!-- Arrow -->
  <line x1="110" y1="61" x2="130" y2="61" stroke="#444" stroke-width="1.5" marker-end="url(#b1)"/>
  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#444"/></marker>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#444"/></marker>
    <marker id="b3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#444"/></marker>
    <marker id="b4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#444"/></marker>
  </defs>
  <!-- Step 2: Intervention labels -->
  <rect x="130" y="38" width="100" height="46" rx="5" fill="#e8f0fb" stroke="#1a4f99" stroke-width="1.5"/>
  <text x="180" y="56" font-family="Georgia, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a4f99">Human</text>
  <text x="180" y="68" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#3a3a3a">Intervention</text>
  <text x="180" y="79" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#888">as label</text>
  <!-- Arrow -->
  <line x1="230" y1="61" x2="250" y2="61" stroke="#444" stroke-width="1.5" marker-end="url(#b2)"/>
  <!-- Step 3: Causal localization -->
  <rect x="250" y="38" width="100" height="46" rx="5" fill="#e8fbe8" stroke="#1a6e3c" stroke-width="1.5"/>
  <text x="300" y="56" font-family="Georgia, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a6e3c">Causal</text>
  <text x="300" y="68" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#3a3a3a">Localization</text>
  <text x="300" y="79" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#888">72–100% flipped</text>
  <!-- Arrow -->
  <line x1="350" y1="61" x2="370" y2="61" stroke="#444" stroke-width="1.5" marker-end="url(#b3)"/>
  <!-- Step 4: Probe-gated steering -->
  <rect x="370" y="38" width="110" height="46" rx="5" fill="#f5f0e8" stroke="#a05c00" stroke-width="1.5"/>
  <text x="425" y="56" font-family="Georgia, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#a05c00">Probe-Gated</text>
  <text x="425" y="68" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#3a3a3a">Steering</text>
  <text x="425" y="79" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#888">↓ oversight burden</text>
  <!-- Finding boxes -->
  <rect x="20" y="110" width="460" height="50" rx="5" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="126" font-family="Georgia, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#3a3a3a">Key finding: 4/5 model families internally represent request is unambiguous</text>
  <text x="250" y="141" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#555">(decodable, causally inert residual stream direction) yet ask anyway</text>
  <!-- Model results -->
  <text x="250" y="178" font-family="Georgia, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Eligible models: Qwen2.5-3B · gemma-2-2b · OLMo-3-7B · Mistral-Nemo-12B · Phi-4</text>
  <text x="250" y="196" font-family="Georgia, serif" font-size="9.5" text-anchor="middle" fill="#888">Steering gated on probe removes most oversight while legitimate questions survive (95% CI excludes zero)</text>
</svg>
