<svg viewBox="0 0 500 210" xmlns="http://www.w3.org/2000/svg" aria-label="Figure 10: Option-channel attack scatter plot — fail-open vs fail-closed rates">
  <rect width="500" height="210" fill="#fff"/>
  <!-- Title -->
  <text x="250" y="18" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a" font-weight="bold">Option-Channel Attack: Fail-Open vs Fail-Closed</text>
  <!-- Axes -->
  <line x1="70" y1="30" x2="70" y2="170" stroke="#888" stroke-width="1.5"/>
  <line x1="70" y1="170" x2="370" y2="170" stroke="#888" stroke-width="1.5"/>
  <text x="220" y="188" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#888">Fail-Closed Rate (false alarm)</text>
  <text x="20" y="100" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#888" transform="rotate(-90,20,100)">Fail-Open Rate</text>
  <!-- Tick marks -->
  <line x1="70" y1="170" x2="70" y2="175" stroke="#888"/>
  <text x="70" y="182" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#888">0</text>
  <line x1="220" y1="170" x2="220" y2="175" stroke="#888"/>
  <text x="220" y="182" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#888">0.5</text>
  <line x1="370" y1="170" x2="370" y2="175" stroke="#888"/>
  <text x="370" y="182" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#888">1.0</text>
  <line x1="65" y1="170" x2="70" y2="170" stroke="#888"/>
  <text x="62" y="173" text-anchor="end" font-family="Georgia,serif" font-size="9" fill="#888">0</text>
  <line x1="65" y1="100" x2="70" y2="100" stroke="#888"/>
  <text x="62" y="103" text-anchor="end" font-family="Georgia,serif" font-size="9" fill="#888">0.5</text>
  <line x1="65" y1="30" x2="70" y2="30" stroke="#888"/>
  <text x="62" y="33" text-anchor="end" font-family="Georgia,serif" font-size="9" fill="#888">1.0</text>
  <!-- Random-guess diagonal -->
  <line x1="70" y1="100" x2="370" y2="100" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="372" y="103" font-family="Georgia,serif" font-size="9" fill="#ccc">chance</text>
  <!-- Ideal corner -->
  <rect x="68" y="28" width="6" height="6" fill="none" stroke="#1a6e3c" stroke-dasharray="2,2"/>
  <text x="80" y="32" font-family="Georgia,serif" font-size="9" fill="#1a6e3c">ideal</text>
  <!-- Model scatter (clustering near diagonal) -->
  <circle cx="180" cy="95" r="6" fill="#b02020" opacity="0.7"/>
  <circle cx="250" cy="102" r="6" fill="#b02020" opacity="0.7"/>
  <circle cx="160" cy="108" r="6" fill="#1a4f99" opacity="0.7"/>
  <circle cx="220" cy="88" r="6" fill="#1a4f99" opacity="0.7"/>
  <circle cx="300" cy="97" r="6" fill="#0d7377" opacity="0.7"/>
  <circle cx="130" cy="115" r="6" fill="#a05c00" opacity="0.7"/>
  <circle cx="290" cy="110" r="6" fill="#a05c00" opacity="0.7"/>
  <!-- Arrow showing attack effect -->
  <line x1="180" y1="95" x2="180" y2="55" stroke="#b02020" stroke-width="1.5" marker-end="url(#a10)"/>
  <text x="183" y="50" font-family="Georgia,serif" font-size="9" fill="#b02020">log injection</text>
  <text x="183" y="61" font-family="Georgia,serif" font-size="9" fill="#b02020">0%→63%</text>
  <defs>
    <marker id="a10" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#b02020"/>
    </marker>
  </defs>
  <!-- Legend -->
  <text x="390" y="60" font-family="Georgia,serif" font-size="10" fill="#888">7 open-weight</text>
  <text x="390" y="72" font-family="Georgia,serif" font-size="10" fill="#888">models</text>
  <text x="390" y="90" font-family="Georgia,serif" font-size="10" fill="#888">Baseline acc:</text>
  <text x="390" y="102" font-family="Georgia,serif" font-size="10" fill="#888">36–72%</text>
  <!-- Note -->
  <text x="250" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888">Option renaming pushes fail-open to 93–100% on 4 models; every tested defense defeated</text>
</svg>
