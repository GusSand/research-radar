<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="TrustNLP six-year timeline: post-hoc interpretability to mechanistic understanding to proactive control">
  <!-- Background -->
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="16" font-family="Georgia,serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">From Interpretability to Control: TrustNLP 6 Years (2608.11171)</text>

  <!-- Timeline axis -->
  <line x1="40" y1="110" x2="460" y2="110" stroke="#aaa" stroke-width="2"/>
  <polygon points="456,107 464,110 456,113" fill="#aaa"/>

  <!-- Phase 1: Post-hoc interpretability (2020-2022) -->
  <rect x="40" y="68" width="120" height="42" rx="4" fill="#e5edff" stroke="#1a4f99" stroke-width="1.5"/>
  <text x="100" y="84" font-family="Arial,sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1a4f99">Post-hoc</text>
  <text x="100" y="97" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#1a4f99">Interpretability</text>
  <text x="100" y="108" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#888">saliency, probing</text>
  <!-- Tick -->
  <line x1="100" y1="110" x2="100" y2="125" stroke="#1a4f99" stroke-width="1.5"/>
  <text x="100" y="138" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#888">2020</text>

  <!-- Phase 2: Mechanistic understanding (2022-2024) -->
  <rect x="180" y="48" width="140" height="62" rx="4" fill="#d1fae5" stroke="#0d7377" stroke-width="1.5"/>
  <text x="250" y="66" font-family="Arial,sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#0d7377">Mechanistic</text>
  <text x="250" y="79" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#0d7377">Understanding</text>
  <text x="250" y="92" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#0d7377">circuits, SAEs, features</text>
  <text x="250" y="103" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#888">attribution graphs</text>
  <line x1="250" y1="110" x2="250" y2="125" stroke="#0d7377" stroke-width="1.5"/>
  <text x="250" y="138" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#888">2022–2024</text>

  <!-- Phase 3: Proactive control (2025-2026) -->
  <rect x="340" y="30" width="120" height="80" rx="4" fill="#fde8e8" stroke="#b02020" stroke-width="2"/>
  <text x="400" y="50" font-family="Arial,sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#b02020">Proactive</text>
  <text x="400" y="63" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#b02020">Control</text>
  <text x="400" y="77" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#b02020">real-time steering</text>
  <text x="400" y="89" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#b02020">monitoring, unlearning</text>
  <text x="400" y="101" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#888">J-Lens, BSF, CRISP</text>
  <line x1="400" y1="110" x2="400" y2="125" stroke="#b02020" stroke-width="1.5"/>
  <text x="400" y="138" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#b02020">2025–2026</text>

  <!-- Transition arrows -->
  <line x1="160" y1="89" x2="178" y2="89" stroke="#aaa" stroke-width="1.5" marker-end="url(#f1)"/>
  <line x1="320" y1="79" x2="338" y2="79" stroke="#aaa" stroke-width="1.5" marker-end="url(#f2)"/>

  <!-- Key finding -->
  <text x="250" y="158" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#333">Field-wide transition documented across 6 years of TrustNLP proceedings:</text>
  <text x="250" y="172" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#0d7377">static model analysis → dynamic generative system control</text>
  <text x="250" y="188" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#888">Interpretability is now a real-time safeguard, not just an analysis tool</text>

  <defs>
    <marker id="f1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#aaa"/></marker>
    <marker id="f2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#aaa"/></marker>
  </defs>
</svg>
