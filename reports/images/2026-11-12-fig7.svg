<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="ZO-LBPG vs primal-dual baseline: policy training trajectories in constrained RLHF, showing ZO-LBPG stays in feasible region while primal-dual crosses into infeasible zone">
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="17" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1a1a1a">Safe RLHF Training: Feasibility of Policy Iterates</text>
  <!-- Feasible region (green background band) -->
  <rect x="60" y="30" width="420" height="130" fill="#e8f4e8" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="270" y="47" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1a6e3c" font-style="italic">Feasible region (harmlessness constraint satisfied)</text>
  <!-- Infeasible region (red band below) -->
  <rect x="60" y="160" width="420" height="40" fill="#ffe8e8" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="270" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#b02020" font-style="italic">Infeasible (constraint violated)</text>
  <!-- Constraint boundary -->
  <line x1="60" y1="160" x2="480" y2="160" stroke="#b02020" stroke-width="2"/>
  <text x="488" y="163" font-family="Georgia, serif" font-size="10" fill="#b02020">c=0</text>
  <!-- ZO-LBPG path (stays in feasible) -->
  <polyline points="80,140 120,120 160,105 200,95 240,88 280,82 320,78 360,74 400,71 440,69" fill="none" stroke="#1a6e3c" stroke-width="2.5"/>
  <circle cx="80" cy="140" r="4" fill="#1a6e3c"/>
  <circle cx="440" cy="69"  r="4" fill="#1a6e3c"/>
  <text x="445" y="68" font-family="Georgia, serif" font-size="10" fill="#1a6e3c">ZO-LBPG (100% feasible)</text>
  <!-- Primal-dual baseline path (dips into infeasible) -->
  <polyline points="80,135 120,110 160,88 200,165 240,172 280,155 320,140 360,130 400,122 440,118" fill="none" stroke="#b02020" stroke-width="2.5" stroke-dasharray="8,4"/>
  <circle cx="80" cy="135" r="4" fill="#b02020"/>
  <circle cx="440" cy="118" r="4" fill="#b02020"/>
  <text x="445" y="118" font-family="Georgia, serif" font-size="10" fill="#b02020">Primal-dual (43–69% infeasible)</text>
  <!-- X axis -->
  <line x1="60" y1="205" x2="480" y2="205" stroke="#333" stroke-width="1.5"/>
  <text x="270" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#444">Training steps →</text>
  <!-- helpfulness annotation -->
  <text x="68" y="102" font-family="Georgia, serif" font-size="10" fill="#444">Helpfulness ↑</text>
  <line x1="66" y1="88" x2="66" y2="155" stroke="#444" stroke-width="1.5" marker-end="url(#arr7)"/>
  <defs>
    <marker id="arr7" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
</svg>
