<svg viewBox="0 0 500 240" xmlns="http://www.w3.org/2000/svg" aria-label="Are Single-Token SAE Features Causally Necessary? — causal necessity by SAE family and layer depth">
  <!-- Background -->
  <rect width="500" height="240" fill="#ffffff"/>
  <!-- Title -->
  <text x="250" y="22" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Causal Necessity of Single-Token SAE Features by Family</text>
  <!-- Y-axis label -->
  <text x="12" y="140" font-family="Georgia, serif" font-size="9" fill="#555" text-anchor="middle" transform="rotate(-90,12,140)">BH-significant ablation (% of 208 conditions)</text>
  <!-- Axes -->
  <line x1="60" y1="195" x2="460" y2="195" stroke="#ccc" stroke-width="1"/>
  <line x1="60" y1="50" x2="60" y2="195" stroke="#ccc" stroke-width="1"/>
  <!-- Y-axis ticks -->
  <line x1="56" y1="195" x2="60" y2="195" stroke="#999" stroke-width="1"/>
  <text x="54" y="198" font-family="Georgia, serif" font-size="9" fill="#555" text-anchor="end">0%</text>
  <line x1="56" y1="153" x2="60" y2="153" stroke="#999" stroke-width="1"/>
  <text x="54" y="156" font-family="Georgia, serif" font-size="9" fill="#555" text-anchor="end">25%</text>
  <line x1="56" y1="112" x2="60" y2="112" stroke="#999" stroke-width="1"/>
  <text x="54" y="115" font-family="Georgia, serif" font-size="9" fill="#555" text-anchor="end">50%</text>
  <line x1="56" y1="71" x2="60" y2="71" stroke="#999" stroke-width="1"/>
  <text x="54" y="74" font-family="Georgia, serif" font-size="9" fill="#555" text-anchor="end">75%</text>
  <!-- Gridlines -->
  <line x1="60" y1="153" x2="460" y2="153" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="60" y1="112" x2="460" y2="112" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="60" y1="71" x2="460" y2="71" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Group labels -->
  <text x="160" y="215" font-family="Georgia, serif" font-size="10" fill="#333" text-anchor="middle">GemmaScope</text>
  <text x="280" y="215" font-family="Georgia, serif" font-size="10" fill="#333" text-anchor="middle">BatchTopK</text>
  <text x="395" y="215" font-family="Georgia, serif" font-size="10" fill="#333" text-anchor="middle">LlamaScope</text>
  <!-- GemmaScope bars: single-token (teal, ~86%) and all features (gray, ~52%) -->
  <rect x="120" y="83" width="30" height="112" fill="#0d7377" rx="2"/>
  <rect x="155" y="133" width="30" height="62" fill="#0d737744" rx="2"/>
  <!-- BatchTopK bars: single-token (teal, ~82%) and all features (gray, ~48%) -->
  <rect x="240" y="90" width="30" height="105" fill="#0d7377" rx="2"/>
  <rect x="275" y="138" width="30" height="57" fill="#0d737744" rx="2"/>
  <!-- LlamaScope bars: single-token (orange/red, ~40%) and all features (gray, ~36%) -->
  <rect x="357" y="135" width="30" height="60" fill="#b05c00" rx="2"/>
  <rect x="392" y="143" width="30" height="52" fill="#b05c0033" rx="2"/>
  <!-- Value labels on bars -->
  <text x="135" y="80" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#0d7377" text-anchor="middle">86%</text>
  <text x="170" y="130" font-family="Georgia, serif" font-size="9" fill="#666" text-anchor="middle">52%</text>
  <text x="255" y="87" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#0d7377" text-anchor="middle">82%</text>
  <text x="290" y="135" font-family="Georgia, serif" font-size="9" fill="#666" text-anchor="middle">48%</text>
  <text x="372" y="132" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#b05c00" text-anchor="middle">40%</text>
  <text x="407" y="140" font-family="Georgia, serif" font-size="9" fill="#666" text-anchor="middle">36%</text>
  <!-- Legend -->
  <rect x="65" y="225" width="12" height="10" fill="#0d7377" rx="1"/>
  <text x="81" y="234" font-family="Georgia, serif" font-size="9" fill="#333">Single-token features (ground-truth causally verifiable)</text>
  <rect x="295" y="225" width="12" height="10" fill="#0d737744" stroke="#0d7377" stroke-width="1" rx="1"/>
  <text x="311" y="234" font-family="Georgia, serif" font-size="9" fill="#333">All features</text>
  <!-- Annotation: cross-family gap -->
  <line x1="372" y1="90" x2="372" y2="132" stroke="#b05c00" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="445" y="112" font-family="Georgia, serif" font-size="8" fill="#b05c00" text-anchor="middle">LlamaScope</text>
  <text x="445" y="122" font-family="Georgia, serif" font-size="8" fill="#b05c00" text-anchor="middle">locally redundant</text>
</svg>
