<svg viewBox="0 0 500 230" xmlns="http://www.w3.org/2000/svg" aria-label="Figure 6: RH-Detect ROC curves for six reward hacking detectors">
  <rect width="500" height="230" fill="#fff"/>
  <!-- Title -->
  <text x="250" y="18" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a" font-weight="bold">RH-Detect: Detector ROC Curves</text>
  <!-- Axes -->
  <line x1="60" y1="30" x2="60" y2="190" stroke="#888" stroke-width="1.5"/>
  <line x1="60" y1="190" x2="360" y2="190" stroke="#888" stroke-width="1.5"/>
  <text x="210" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#888">False Positive Rate</text>
  <text x="16" y="115" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#888" transform="rotate(-90,16,115)">True Positive Rate</text>
  <!-- Tick labels -->
  <text x="57" y="193" text-anchor="end" font-family="Georgia,serif" font-size="9" fill="#888">0</text>
  <text x="57" y="113" text-anchor="end" font-family="Georgia,serif" font-size="9" fill="#888">0.5</text>
  <text x="57" y="33" text-anchor="end" font-family="Georgia,serif" font-size="9" fill="#888">1.0</text>
  <!-- Chance line -->
  <line x1="60" y1="190" x2="360" y2="30" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Qwen AUC ~0.96 -->
  <polyline points="60,190 72,60 100,38 160,33 260,31 360,30" fill="none" stroke="#0d7377" stroke-width="2.5"/>
  <!-- Gemini AUC ~0.96 -->
  <polyline points="60,190 74,62 102,40 162,34 262,31 360,30" fill="none" stroke="#1a4f99" stroke-width="2" stroke-dasharray="7,2"/>
  <!-- Grok AUC ~0.96 -->
  <polyline points="60,190 76,64 104,42 164,35 264,32 360,30" fill="none" stroke="#1a6e3c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- GPT-5 Nano AUC 0.817 -->
  <polyline points="60,190 90,130 130,95 200,68 290,50 360,38" fill="none" stroke="#b02020" stroke-width="2" stroke-dasharray="3,3"/>
  <!-- Legend -->
  <line x1="370" y1="45" x2="395" y2="45" stroke="#0d7377" stroke-width="2.5"/>
  <text x="398" y="49" font-family="Georgia,serif" font-size="10" fill="#0d7377">Qwen 0.962</text>
  <line x1="370" y1="62" x2="395" y2="62" stroke="#1a4f99" stroke-width="2" stroke-dasharray="7,2"/>
  <text x="398" y="66" font-family="Georgia,serif" font-size="10" fill="#1a4f99">Gemini 0.961</text>
  <line x1="370" y1="79" x2="395" y2="79" stroke="#1a6e3c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="398" y="83" font-family="Georgia,serif" font-size="10" fill="#1a6e3c">Grok 0.958</text>
  <line x1="370" y1="96" x2="395" y2="96" stroke="#b02020" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="398" y="100" font-family="Georgia,serif" font-size="10" fill="#b02020">GPT-5 Nano</text>
  <text x="398" y="112" font-family="Georgia,serif" font-size="10" fill="#b02020">0.817</text>
  <!-- Callout: MALT/TRACE gap -->
  <text x="250" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888">Multi-turn tool-use (MALT/TRACE) accuracy lags 10.7–15.9 pp vs other subsets</text>
</svg>
