<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Probe d-prime stays stable while model answer d-prime decreases after post-training">
  <rect width="500" height="220" fill="#fafaf8"/>
  <text x="250" y="18" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#222" font-weight="bold">Post-training: representation intact, readout degraded</text>
  <!-- Left panel: probe sensitivity -->
  <text x="125" y="40" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#0d7377" font-weight="bold">Linear Probe d′</text>
  <rect x="75" y="50" width="40" height="100" rx="3" fill="#0d7377" opacity="0.75"/>
  <text x="95" y="47" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#0d7377">3.1</text>
  <rect x="130" y="46" width="40" height="104" rx="3" fill="#0d7377" opacity="0.65"/>
  <text x="150" y="43" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#0d7377">3.3</text>
  <text x="95" y="162" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888">Base</text>
  <text x="150" y="162" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888">Post-trained</text>
  <text x="125" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#0d7377">Stable (d′ ≈ 1.4–3.7)</text>
  <!-- Right panel: answer sensitivity drops -->
  <text x="375" y="40" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#b02020" font-weight="bold">Model Answer d′</text>
  <rect x="325" y="80" width="40" height="70" rx="3" fill="#b02020" opacity="0.65"/>
  <text x="345" y="77" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#b02020">1.8</text>
  <rect x="380" y="104" width="40" height="46" rx="3" fill="#b02020" opacity="0.4"/>
  <text x="400" y="101" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#b02020">1.4</text>
  <line x1="345" y1="80" x2="400" y2="104" stroke="#b02020" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c1)"/>
  <defs><marker id="c1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b02020"/></marker></defs>
  <text x="345" y="162" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888">Base</text>
  <text x="400" y="162" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888">Post-trained</text>
  <text x="375" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#b02020">Δd′ = −0.34 (14/18 families ↓)</text>
  <!-- Divider -->
  <line x1="250" y1="35" x2="250" y2="185" stroke="#ddd" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- Bottom annotation -->
  <text x="250" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888">Change localised: post-text positions (Q/A cue tokens), mid-layer upward; not text-token positions</text>
</svg>
