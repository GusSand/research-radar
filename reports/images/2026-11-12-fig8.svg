<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Neuron circuit transferability experiment: 12-neuron causal group for two-hop relation chains, showing disjoint subsets can independently flip the bridge-entity answer">
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="16" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1a1a1a">Causal Neuron Circuit: Subset Sufficiency and Transferability</text>
  <!-- Full 12-neuron group box -->
  <rect x="20" y="30" width="200" height="90" rx="6" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <text x="120" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#444">Full group (12 neurons)</text>
  <!-- Neurons in full group -->
  <circle cx="45"  cy="66" r="7" fill="#1a4f99" opacity="0.8"/><text x="45"  cy="70" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N1</text>
  <circle cx="68"  cy="66" r="7" fill="#1a4f99" opacity="0.8"/><text x="68"  cy="70" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N2</text>
  <circle cx="91"  cy="66" r="7" fill="#b02020" opacity="0.8"/><text x="91"  cy="70" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N3</text>
  <circle cx="114" cy="66" r="7" fill="#b02020" opacity="0.8"/><text x="114" cy="70" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N4</text>
  <circle cx="137" cy="66" r="7" fill="#1a6e3c" opacity="0.8"/><text x="137" cy="70" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N5</text>
  <circle cx="160" cy="66" r="7" fill="#1a6e3c" opacity="0.8"/><text x="160" cy="70" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N6</text>
  <circle cx="45"  cy="92" r="7" fill="#5c1aaa" opacity="0.8"/><text x="45"  cy="96" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N7</text>
  <circle cx="68"  cy="92" r="7" fill="#5c1aaa" opacity="0.8"/><text x="68"  cy="96" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N8</text>
  <circle cx="91"  cy="92" r="7" fill="#1a4f99" opacity="0.8"/><text x="91"  cy="96" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N9</text>
  <circle cx="114" cy="92" r="7" fill="#b02020" opacity="0.8"/><text x="114" cy="96" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N10</text>
  <circle cx="137" cy="92" r="7" fill="#1a6e3c" opacity="0.8"/><text x="137" cy="96" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N11</text>
  <circle cx="160" cy="92" r="7" fill="#5c1aaa" opacity="0.8"/><text x="160" cy="96" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#fff">N12</text>
  <!-- Subset A box -->
  <rect x="20" y="140" width="90" height="55" rx="4" fill="#e8f4ff" stroke="#1a4f99" stroke-width="1.5"/>
  <text x="65" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1a4f99">Subset A (6 neurons)</text>
  <circle cx="38"  cy="170" r="6" fill="#1a4f99" opacity="0.8"/>
  <circle cx="55"  cy="170" r="6" fill="#1a4f99" opacity="0.8"/>
  <circle cx="72"  cy="170" r="6" fill="#b02020" opacity="0.8"/>
  <circle cx="89"  cy="170" r="6" fill="#5c1aaa" opacity="0.8"/>
  <!-- Subset B box -->
  <rect x="130" y="140" width="90" height="55" rx="4" fill="#fff0e8" stroke="#b02020" stroke-width="1.5"/>
  <text x="175" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#b02020">Subset B (6 neurons)</text>
  <circle cx="148" cy="170" r="6" fill="#1a6e3c" opacity="0.8"/>
  <circle cx="165" cy="170" r="6" fill="#1a6e3c" opacity="0.8"/>
  <circle cx="182" cy="170" r="6" fill="#5c1aaa" opacity="0.8"/>
  <circle cx="199" cy="170" r="6" fill="#b02020" opacity="0.8"/>
  <!-- Arrows from full group to subsets -->
  <line x1="65" y1="121" x2="65" y2="138" stroke="#888" stroke-width="1.5"/>
  <line x1="175" y1="121" x2="175" y2="138" stroke="#888" stroke-width="1.5"/>
  <!-- Result boxes -->
  <rect x="250" y="30" width="230" height="80" rx="6" fill="#f8f8f8" stroke="#888" stroke-width="1"/>
  <text x="365" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1a1a1a">Patching experiment results</text>
  <text x="265" y="68" font-family="Georgia, serif" font-size="10" fill="#444">• 9/11 chains: answer → bridge entity</text>
  <text x="265" y="84" font-family="Georgia, serif" font-size="10" fill="#444">• Disjoint subsets each sufficient</text>
  <text x="265" y="100" font-family="Georgia, serif" font-size="10" fill="#444">• Transfers to rephrasings, not other chains</text>
  <!-- Result boxes for subsets -->
  <rect x="250" y="130" width="100" height="40" rx="4" fill="#e8f4e8" stroke="#1a6e3c" stroke-width="1.5"/>
  <text x="300" y="147" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1a6e3c">Subset A alone:</text>
  <text x="300" y="163" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1a6e3c">flips answer ✓</text>
  <rect x="370" y="130" width="100" height="40" rx="4" fill="#e8f4e8" stroke="#1a6e3c" stroke-width="1.5"/>
  <text x="420" y="147" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1a6e3c">Subset B alone:</text>
  <text x="420" y="163" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1a6e3c">flips answer ✓</text>
  <!-- Annotation: not transferable -->
  <text x="260" y="195" font-family="Georgia, serif" font-size="10" fill="#888" font-style="italic">Different chain: transfer fails (Qwen3-1.7B, Llama-3.2-1B, Gemma-3-1B)</text>
</svg>
