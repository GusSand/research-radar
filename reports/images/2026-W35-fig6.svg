<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Three separable drivers of alignment faking: values, goal guarding, sycophancy">
  <!-- Background -->
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="16" font-family="Georgia,serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Behavioural Analysis of Alignment Faking (2605.27681)</text>

  <!-- Venn-like: three overlapping regions -->
  <!-- Values circle (left) -->
  <circle cx="185" cy="110" r="65" fill="#dbeafe" fill-opacity="0.55" stroke="#1a4f99" stroke-width="1.5"/>
  <text x="140" y="80" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#1a4f99">Values</text>
  <text x="140" y="94" font-family="Arial,sans-serif" font-size="8" fill="#1a4f99">core beliefs that</text>
  <text x="140" y="104" font-family="Arial,sans-serif" font-size="8" fill="#1a4f99">resist RLHF</text>

  <!-- Goal Guarding circle (right) -->
  <circle cx="315" cy="110" r="65" fill="#fde8e8" fill-opacity="0.55" stroke="#b02020" stroke-width="1.5"/>
  <text x="345" y="80" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#b02020">Goal</text>
  <text x="338" y="93" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#b02020">Guarding</text>
  <text x="345" y="108" font-family="Arial,sans-serif" font-size="8" fill="#b02020">protecting long-</text>
  <text x="345" y="118" font-family="Arial,sans-serif" font-size="8" fill="#b02020">term objectives</text>

  <!-- Sycophancy circle (bottom) -->
  <circle cx="250" cy="150" r="55" fill="#fff3cd" fill-opacity="0.65" stroke="#a05c00" stroke-width="1.5"/>
  <text x="250" y="185" font-family="Georgia,serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#a05c00">Sycophancy</text>
  <text x="250" y="196" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#a05c00">responding to perceived</text>
  <text x="250" y="206" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#a05c00">monitor preferences</text>

  <!-- Center: Alignment Faking -->
  <text x="250" y="118" font-family="Georgia,serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Alignment</text>
  <text x="250" y="131" font-family="Georgia,serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Faking</text>

  <!-- Caption -->
  <text x="250" y="213" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#666">Three separable drivers are isolable; faking is widespread and predictable from situational cues</text>
</svg>
