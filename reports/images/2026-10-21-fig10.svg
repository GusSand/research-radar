<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Decision Sufficiency: SAE feature information gap for safe control">
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="20" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Decision Sufficiency of SAE Interfaces</text>
  <!-- Full-state path -->
  <rect x="20" y="45" width="110" height="36" rx="4" fill="#e0eaf8" stroke="#1a4f99" stroke-width="1.5"/>
  <text x="75" y="65" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#1a4f99">Full state s</text>
  <line x1="130" y1="63" x2="178" y2="63" stroke="#1a4f99" stroke-width="1.5"/>
  <polygon points="178,58 190,63 178,68" fill="#1a4f99"/>
  <rect x="190" y="45" width="110" height="36" rx="4" fill="#e0eaf8" stroke="#1a4f99" stroke-width="1.5"/>
  <text x="245" y="60" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#1a4f99">Optimal</text>
  <text x="245" y="74" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#1a4f99">controller π*</text>
  <line x1="300" y1="63" x2="348" y2="63" stroke="#1a4f99" stroke-width="1.5"/>
  <polygon points="348,58 360,63 348,68" fill="#1a4f99"/>
  <rect x="360" y="45" width="120" height="36" rx="4" fill="#e0eaf8" stroke="#1a4f99" stroke-width="1.5"/>
  <text x="420" y="60" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#1a4f99">assist/clarify</text>
  <text x="420" y="74" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#1a4f99">/ refuse</text>
  <text x="345" y="38" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#1a6e3c" font-weight="bold">minimum loss L*</text>
  <!-- SAE path -->
  <rect x="20" y="120" width="110" height="36" rx="4" fill="#fdf3e0" stroke="#a05c00" stroke-width="1.5"/>
  <text x="75" y="135" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#a05c00">2 SAE</text>
  <text x="75" y="149" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#a05c00">features φ(s)</text>
  <line x1="130" y1="138" x2="178" y2="138" stroke="#a05c00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="178,133 190,138 178,143" fill="#a05c00"/>
  <rect x="190" y="120" width="110" height="36" rx="4" fill="#fdf3e0" stroke="#a05c00" stroke-width="1.5"/>
  <text x="245" y="135" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#a05c00">Controller</text>
  <text x="245" y="149" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#a05c00">on φ(s)</text>
  <line x1="300" y1="138" x2="348" y2="138" stroke="#a05c00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="348,133 360,138 348,143" fill="#a05c00"/>
  <rect x="360" y="120" width="120" height="36" rx="4" fill="#fdf3e0" stroke="#a05c00" stroke-width="1.5"/>
  <text x="420" y="135" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#a05c00">assist/clarify</text>
  <text x="420" y="149" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#a05c00">/ refuse</text>
  <!-- Information gap -->
  <line x1="245" y1="81" x2="245" y2="120" stroke="#b02020" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="265" y="104" font-family="Georgia, serif" font-size="10" fill="#b02020" font-weight="bold">info gap</text>
  <text x="265" y="116" font-family="Georgia, serif" font-size="10" fill="#b02020">Δ=0.03–0.12</text>
  <text x="345" y="113" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#b02020" font-weight="bold">loss L* + ΔL</text>
  <!-- Caption -->
  <text x="250" y="195" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#555">SmolLM2: restricting to 2 SAE features raises minimum loss by 0.035–0.117</text>
  <text x="250" y="208" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#555">(excess loss = irreducible information loss, not controller weakness)</text>
</svg>
