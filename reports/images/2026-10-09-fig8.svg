<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Figure 8: Anytime-valid detection of LLM weight exfiltration via e-process">
  <rect width="500" height="220" fill="#fff"/>
  <!-- Title -->
  <text x="250" y="18" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a" font-weight="bold">E-Process: Sequential Weight Exfil Detection</text>
  <!-- Left panel: e-process accumulation -->
  <text x="120" y="36" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#888">E-process over responses</text>
  <line x1="30" y1="44" x2="30" y2="170" stroke="#888" stroke-width="1.5"/>
  <line x1="30" y1="170" x2="210" y2="170" stroke="#888" stroke-width="1.5"/>
  <text x="120" y="183" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888">Response index</text>
  <text x="12" y="107" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888" transform="rotate(-90,12,107)">e-value</text>
  <!-- Alarm threshold -->
  <line x1="30" y1="75" x2="210" y2="75" stroke="#b02020" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="212" y="79" font-family="Georgia,serif" font-size="9" fill="#b02020">alarm</text>
  <!-- Attack accumulation (crosses threshold) -->
  <polyline points="30,168 48,160 65,148 82,128 99,100 116,80 133,65" fill="none" stroke="#0d7377" stroke-width="2.5"/>
  <!-- Benign (stays flat) -->
  <polyline points="30,168 48,166 65,165 82,164 99,163 116,164 133,163 150,163 167,162 185,162" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="140" y="60" font-family="Georgia,serif" font-size="10" fill="#0d7377">attack</text>
  <text x="188" y="155" font-family="Georgia,serif" font-size="10" fill="#888">benign</text>
  <!-- Right panel: detectability vs bits/token -->
  <text x="360" y="36" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#888">Detection fraction vs bit rate</text>
  <line x1="240" y1="44" x2="240" y2="170" stroke="#888" stroke-width="1.5"/>
  <line x1="240" y1="170" x2="480" y2="170" stroke="#888" stroke-width="1.5"/>
  <text x="360" y="183" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888">Bits per token</text>
  <!-- Qwen3-32B (detected) -->
  <polyline points="240,168 270,155 300,130 320,80 340,50 360,44" fill="none" stroke="#0d7377" stroke-width="2"/>
  <text x="362" y="47" font-family="Georgia,serif" font-size="9" fill="#0d7377">Qwen3-32B</text>
  <!-- Qwen3-30B-A3B (evades at 0.03 bpt) -->
  <polyline points="240,168 270,165 300,160 320,155 340,150 360,148 380,140 400,90 420,48" fill="none" stroke="#1a4f99" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="365" y="100" font-family="Georgia,serif" font-size="9" fill="#1a4f99">Qwen3-30B-A3B</text>
  <!-- Vertical line at 0.0258 -->
  <line x1="316" y1="44" x2="316" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="316" y="42" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#888">0.026 bpt</text>
  <!-- Key stats -->
  <text x="250" y="204" text-anchor="start" font-family="Georgia,serif" font-size="10" fill="#888">Anytime false-alarm control · NeurIPS 2026 E-Values Workshop (oral)</text>
</svg>
