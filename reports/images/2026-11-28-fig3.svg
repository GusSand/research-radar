<svg viewBox="0 0 500 240" xmlns="http://www.w3.org/2000/svg" aria-label="Reasoning optimization raises unsafe rate across model families; ESPG restoration brings it back down">
  <rect width="500" height="240" fill="#fff"/>
  <text x="250" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#222" font-weight="bold">Unsafe Rate by Training Stage</text>
  <line x1="60" y1="40" x2="60" y2="185" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="185" x2="470" y2="185" stroke="#333" stroke-width="1.5"/>
  <text x="55" y="188" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">0%</text>
  <text x="55" y="153" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">10%</text>
  <text x="55" y="118" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">20%</text>
  <text x="55" y="83" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">30%</text>
  <text x="55" y="48" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">40%</text>
  <line x1="60" y1="150" x2="470" y2="150" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="60" y1="115" x2="470" y2="115" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="60" y1="80" x2="470" y2="80" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="60" y1="45" x2="470" y2="45" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,4"/>
  <!-- Model A bars: Base 8%, Reasoning 28%, ESPG 10% -->
  <rect x="75"  y="157" width="25" height="28" fill="#4a7ec9"/>
  <rect x="103" y="87"  width="25" height="98" fill="#c94a4a"/>
  <rect x="131" y="150" width="25" height="35" fill="#2eaa5c"/>
  <text x="115" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#444">Model A</text>
  <!-- Model B bars: Base 6%, Reasoning 32%, ESPG 9% -->
  <rect x="195" y="164" width="25" height="21" fill="#4a7ec9"/>
  <rect x="223" y="73"  width="25" height="112" fill="#c94a4a"/>
  <rect x="251" y="153" width="25" height="32" fill="#2eaa5c"/>
  <text x="235" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#444">Model B</text>
  <!-- Model C bars: Base 10%, Reasoning 25%, ESPG 11% -->
  <rect x="315" y="150" width="25" height="35" fill="#4a7ec9"/>
  <rect x="343" y="97"  width="25" height="88" fill="#c94a4a"/>
  <rect x="371" y="147" width="25" height="38" fill="#2eaa5c"/>
  <text x="355" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#444">Model C</text>
  <!-- Legend -->
  <rect x="80"  y="215" width="12" height="10" fill="#4a7ec9"/>
  <text x="95"  y="224" font-family="Georgia, serif" font-size="10" fill="#333">Base</text>
  <rect x="145" y="215" width="12" height="10" fill="#c94a4a"/>
  <text x="160" y="224" font-family="Georgia, serif" font-size="10" fill="#333">Reasoning-tuned (↑ unsafe)</text>
  <rect x="335" y="215" width="12" height="10" fill="#2eaa5c"/>
  <text x="350" y="224" font-family="Georgia, serif" font-size="10" fill="#333">+ESPG (restored)</text>
</svg>
