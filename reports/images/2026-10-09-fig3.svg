<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" aria-label="Figure 3: NOMOS four-pass policy compiler pipeline">
  <rect width="500" height="200" fill="#fff"/>
  <!-- Title -->
  <text x="250" y="18" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a" font-weight="bold">NOMOS: Policy → Verified Gate</text>
  <!-- Offline label -->
  <rect x="20" y="28" width="360" height="105" rx="4" fill="none" stroke="#ccc" stroke-dasharray="4,3"/>
  <text x="30" y="44" font-family="Georgia,serif" font-size="10" fill="#888" font-style="italic">Offline (once per policy)</text>
  <!-- Boxes -->
  <!-- Policy text -->
  <rect x="30" y="50" width="72" height="36" rx="3" fill="#f0ede8" stroke="#ccc"/>
  <text x="66" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a1a1a" font-weight="bold">Policy</text>
  <text x="66" y="81" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#888">text</text>
  <!-- Arrow -->
  <line x1="102" y1="68" x2="120" y2="68" stroke="#888" stroke-width="1.5" marker-end="url(#a3)"/>
  <!-- Extract (LLM) -->
  <rect x="120" y="50" width="68" height="36" rx="3" fill="#dce8fc" stroke="#1a4f99"/>
  <text x="154" y="67" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a4f99" font-weight="bold">Extract</text>
  <text x="154" y="79" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#1a4f99">(LLM)</text>
  <!-- Arrow -->
  <line x1="188" y1="68" x2="206" y2="68" stroke="#888" stroke-width="1.5" marker-end="url(#a3b)"/>
  <!-- Resolve -->
  <rect x="206" y="50" width="68" height="36" rx="3" fill="#d4edda" stroke="#1a6e3c"/>
  <text x="240" y="67" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1a6e3c" font-weight="bold">Resolve</text>
  <text x="240" y="79" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#1a6e3c">(static)</text>
  <!-- Reject label -->
  <text x="240" y="100" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#b02020">rejects 13–37%</text>
  <!-- Arrow -->
  <line x1="274" y1="68" x2="292" y2="68" stroke="#888" stroke-width="1.5" marker-end="url(#a3c)"/>
  <!-- Validate -->
  <rect x="292" y="50" width="72" height="36" rx="3" fill="#fef3d0" stroke="#a05c00"/>
  <text x="328" y="67" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#a05c00" font-weight="bold">Validate</text>
  <text x="328" y="79" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#a05c00">(replay)</text>
  <!-- Marker -->
  <defs>
    <marker id="a3" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#888"/>
    </marker>
    <marker id="a3b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#888"/>
    </marker>
    <marker id="a3c" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#888"/>
    </marker>
    <marker id="a3d" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#888"/>
    </marker>
    <marker id="a3e" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#888"/>
    </marker>
  </defs>
  <!-- Arrow to gate -->
  <line x1="364" y1="68" x2="390" y2="68" stroke="#888" stroke-width="1.5" marker-end="url(#a3d)"/>
  <!-- Gate box (runtime) -->
  <rect x="390" y="38" width="88" height="60" rx="4" fill="#ede8fc" stroke="#5c1aaa" stroke-width="1.5"/>
  <text x="434" y="61" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#5c1aaa" font-weight="bold">Runtime</text>
  <text x="434" y="75" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#5c1aaa">Gate</text>
  <text x="434" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#888">μs, no LLM</text>
  <!-- Runtime label -->
  <text x="434" y="125" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888" font-style="italic">Runtime</text>
  <!-- Results callout -->
  <text x="250" y="148" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#1a1a1a">τ²-bench violations: 66.3% → 2.6% (airline) · 30.8% → 6.9% (retail)</text>
  <text x="250" y="163" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#1a1a1a">AgentDojo banking: 0% ASR across 9 attack families</text>
  <text x="250" y="183" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#888">Open-weight 26B compilation ≈ hand-written or frontier-compiled rules</text>
</svg>
