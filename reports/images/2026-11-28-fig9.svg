<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Linguistic tells of LLM deception in Werewolf: wolves score higher on certainty and emotional intensification">
  <rect width="500" height="220" fill="#fff"/>
  <text x="250" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#222" font-weight="bold">Linguistic Features: Wolf vs. Villager (5,404 utterances)</text>
  <!-- Y axis -->
  <line x1="90" y1="38" x2="90" y2="175" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="175" x2="460" y2="175" stroke="#333" stroke-width="1.5"/>
  <!-- Y labels -->
  <text x="85" y="178" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">0</text>
  <text x="85" y="140" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">0.05</text>
  <text x="85" y="102" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">0.10</text>
  <text x="85" y="64" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">0.15</text>
  <line x1="90" y1="140" x2="460" y2="140" stroke="#eee" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="90" y1="102" x2="460" y2="102" stroke="#eee" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="90" y1="64"  x2="460" y2="64"  stroke="#eee" stroke-width="0.5" stroke-dasharray="4,3"/>
  <!-- Feature 1: Certainty (wolf +0.074) -->
  <rect x="115" y="145" width="30" height="30" fill="#c0c0d8"/>
  <rect x="150" y="145" width="30" height="30" fill="#888" opacity="0.4"/>
  <!-- wolf bar on certainty (0.074 above villager) -->
  <!-- villager baseline ~0 -->
  <text x="147" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#444">Certainty</text>
  <!-- Feature 2: Uncertainty (wolf +0.072) -->
  <rect x="225" y="146" width="30" height="29" fill="#c0c0d8"/>
  <rect x="260" y="146" width="30" height="29" fill="#888" opacity="0.4"/>
  <text x="258" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#444">Uncertainty</text>
  <!-- Feature 3: Emotional intens. (wolf r=.145 → 0.145×280≈41px) -->
  <rect x="335" y="117" width="30" height="58" fill="#c94a4a"/>
  <rect x="370" y="117" width="30" height="58" fill="#888" opacity="0.4"/>
  <text x="367" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#444">Emot. Intens.</text>
  <!-- Fix: show wolf vs. villager separately with actual differences -->
  <!-- Redraw properly: wolf score higher, villager lower -->
  <!-- Actually let me simplify to a cleaner grouped bar chart -->
  <!-- Legend -->
  <rect x="100" y="205" width="12" height="10" fill="#4a7ec9"/>
  <text x="115" y="214" font-family="Georgia, serif" font-size="10" fill="#333">Wolf (effect size above villager)</text>
  <rect x="310" y="205" width="12" height="10" fill="#888" opacity="0.6"/>
  <text x="325" y="214" font-family="Georgia, serif" font-size="10" fill="#333">LLM judge acc. 60.8–70.2%</text>
  <!-- Repaint the bars: show effect size as single bar per feature -->
  <!-- Reset canvas background for bars area -->
  <rect x="91" y="39" width="368" height="136" fill="#fff"/>
  <!-- Y labels redrawn -->
  <text x="85" y="178" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">0</text>
  <text x="85" y="118" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">0.08</text>
  <text x="85" y="58"  text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#555">0.15</text>
  <line x1="90" y1="118" x2="460" y2="118" stroke="#eee" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="90" y1="58"  x2="460" y2="58"  stroke="#eee" stroke-width="0.5" stroke-dasharray="4,3"/>
  <!-- Effect sizes scaled to 175px=0, 58px=0.15 → scale = (175-58)/0.15 = 780px per unit -->
  <!-- Certainty +0.074: height = 0.074*780 ≈ 58px; top = 175-58=117 -->
  <rect x="130" y="117" width="50" height="58" fill="#4a7ec9"/>
  <text x="155" y="109" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a7ec9">+0.074</text>
  <!-- Uncertainty +0.072: height ≈ 56px; top = 175-56=119 -->
  <rect x="225" y="119" width="50" height="56" fill="#6a8ec9"/>
  <text x="250" y="111" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6a8ec9">+0.072</text>
  <!-- Emotional intensif. r=.145: height = 0.145*780 ≈ 113px; top = 175-113=62 -->
  <rect x="320" y="62" width="50" height="113" fill="#c94a4a"/>
  <text x="345" y="54" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c94a4a">r=.145</text>
  <text x="155" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#444">Certainty</text>
  <text x="250" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#444">Uncertainty</text>
  <text x="345" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#444">Emot. Intens.</text>
</svg>
