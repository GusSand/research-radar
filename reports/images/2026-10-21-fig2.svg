<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="Local Allow, Global Deny: compositional authorization failure">
  <rect width="500" height="220" fill="#fff"/>
  <!-- Title -->
  <text x="250" y="22" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Compositional Authorization Failure (CAF)</text>
  <!-- Four action boxes with green checks -->
  <rect x="20" y="40" width="80" height="44" rx="5" fill="#e6f4ea" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="60" y="58" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#1a4a1a">Action a₁</text>
  <text x="60" y="74" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#2a7a2a" font-weight="bold">✓ Allow</text>
  <rect x="130" y="40" width="80" height="44" rx="5" fill="#e6f4ea" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="170" y="58" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#1a4a1a">Action a₂</text>
  <text x="170" y="74" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#2a7a2a" font-weight="bold">✓ Allow</text>
  <rect x="240" y="40" width="80" height="44" rx="5" fill="#e6f4ea" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="280" y="58" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#1a4a1a">Action a₃</text>
  <text x="280" y="74" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#2a7a2a" font-weight="bold">✓ Allow</text>
  <rect x="350" y="40" width="80" height="44" rx="5" fill="#e6f4ea" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="390" y="58" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#1a4a1a">Action a₄</text>
  <text x="390" y="74" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#2a7a2a" font-weight="bold">✓ Allow</text>
  <!-- Arrows pointing down to combined box -->
  <line x1="60" y1="84" x2="60" y2="130" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="170" y1="84" x2="170" y2="130" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="280" y1="84" x2="280" y2="130" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="390" y1="84" x2="390" y2="130" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- Combined sequence box -->
  <rect x="60" y="130" width="330" height="44" rx="5" fill="#fce8e8" stroke="#b02020" stroke-width="2"/>
  <text x="225" y="149" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#7a1a1a">Combined sequence {a₁,a₂,a₃,a₄}</text>
  <text x="225" y="165" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#b02020" font-weight="bold">✗ Global Policy Φ VIOLATED</text>
  <!-- Label -->
  <text x="250" y="200" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#555">Per-action monitor cannot detect: no single step is to blame (2-safety hyperproperty)</text>
</svg>
