<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" aria-label="LPF reveals hidden model behavior: standard eval misses it, limited-parameter finetuning exposes it">
  <rect width="500" height="220" fill="#fff"/>
  <!-- Title -->
  <text x="250" y="22" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Limited-Parameter Finetuning (LPF) Reveals Hidden Behaviors</text>
  <!-- Standard Eval column -->
  <rect x="60" y="40" width="160" height="150" rx="6" fill="#f0ede8" stroke="#ddd" stroke-width="1.5"/>
  <text x="140" y="62" font-family="Georgia, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#888">Standard Behavioral Eval</text>
  <rect x="90" y="75" width="100" height="30" rx="4" fill="#4ade80" opacity="0.6"/>
  <text x="140" y="94" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#1a6e3c">Model A ✓ safe</text>
  <rect x="90" y="115" width="100" height="30" rx="4" fill="#4ade80" opacity="0.6"/>
  <text x="140" y="134" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#1a6e3c">Model B ✓ safe</text>
  <rect x="90" y="155" width="100" height="25" rx="4" fill="#4ade80" opacity="0.6"/>
  <text x="140" y="171" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#1a6e3c">Model C ✓ safe</text>
  <!-- Arrow -->
  <line x1="230" y1="115" x2="270" y2="115" stroke="#888" stroke-width="2"/>
  <polygon points="270,110 280,115 270,120" fill="#888"/>
  <text x="255" y="109" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#888">LPF</text>
  <text x="255" y="130" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#888">3-25%</text>
  <text x="255" y="142" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#888">LoRA</text>
  <!-- LPF column -->
  <rect x="280" y="40" width="160" height="150" rx="6" fill="#f0ede8" stroke="#ddd" stroke-width="1.5"/>
  <text x="360" y="62" font-family="Georgia, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#888">After LPF Audit</text>
  <rect x="310" y="75" width="100" height="30" rx="4" fill="#4ade80" opacity="0.6"/>
  <text x="360" y="94" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#1a6e3c">Model A ✓ safe</text>
  <rect x="310" y="115" width="100" height="30" rx="4" fill="#f07070" opacity="0.7"/>
  <text x="360" y="134" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#b02020">Model B ✗ hidden!</text>
  <rect x="310" y="155" width="100" height="25" rx="4" fill="#f0a030" opacity="0.7"/>
  <text x="360" y="171" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#a05c00">Model C △ subtle</text>
</svg>
